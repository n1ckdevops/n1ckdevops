 q('___ you like coffee?', ['Are','Do','Does'],1,'Вопрос с you в Present Simple начинается с Do.')
 ]},
 {name:'Elementary',short:'A1–A2',description:'Основные времена, количество и вопросы',questions:[

Object.keys(TRACKS).forEach(key=>{const t=TRACKS[key];t.questions=t.levels.flatMap((level,levelIndex)=>level.questions.map((question,i)=>({...question,levelIndex,localIndex:i})));});
const $=(s,root=document)=>root.querySelector(s);
const escapeHTML=str=>String(str).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
let state={view:'home',track:null,index:0,answers:[]};let timer=null;let soundOn=true;let audioCtx=null;
const main=$('#main');
function cancelTimer(){if(timer!==null){clearTimeout(timer);timer=null;}}
function playSound(kind='pick'){
 if(!soundOn)return;
 try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;audioCtx ||= new Ctx();if(audioCtx.state==='suspended')audioCtx.resume();
 const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(kind==='pick'?660:740,now);if(kind==='next')osc.frequency.exponentialRampToValueAtTime(900,now+.11);
 gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.034,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+.15);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.16);
 }catch(e){}
}
function updateSound(){const el=$('#soundToggle');el.setAttribute('aria-pressed',String(soundOn));el.setAttribute('aria-label',soundOn?'Выключить звук':'Включить звук');$('#soundLabel').textContent=soundOn?'Звук вкл.':'Звук выкл.';el.querySelector('.sound-icon').textContent=soundOn?'♪':'♩';}
function jumpTop(){window.scrollTo({top:0,behavior:'instant'});}
function goHome(){cancelTimer();state={view:'home',track:null,index:0,answers:[]};render();jumpTop();}
function start(type){cancelTimer();state={view:'quiz',track:type,index:0,answers:Array(TRACKS[type].questions.length).fill(null)};render();jumpTop();}
function getReading(){return state.track==='adults'&&state.view==='quiz'&&state.index>=15&&state.index<20;}
function renderHome(){main.innerHTML=`<section class="hero"><div class="eyebrow">Find your starting point</div><h1>Английский начинается<br><span class="blue">с правильного уровня.</span></h1><p>Два продуманных теста, понятные задания и персональная рекомендация после прохождения. Выбери подходящий вариант.</p></section><section class="cards" aria-label="Выберите тест"><article class="test-card card-kids"><div class="card-icon" aria-hidden="true">✳</div><div class="card-label">Для детей · 8–12 лет</div><h2>Учиться с интересом.</h2><p>Слова по картинкам, задания с животными и комнатами, а также грамматика в рамках Kid’s Box Starter–3.</p><div class="pill-list"><span>25 вопросов</span><span>10 картинок</span><span>Starter — Level 3</span></div><button type="button" class="card-action" id="kidsStart"><span>Начать детский тест</span><span class="round-arrow">↗</span></button></article><article class="test-card card-adults"><div class="card-icon" aria-hidden="true">✦</div><div class="card-label">Для взрослых</div><h2>Знать свой уровень.</h2><p>15 вопросов по грамматике, текст с пятью заданиями и пять практических ситуаций. От Beginner до Intermediate.</p><div class="pill-list"><span>25 вопросов</span><span>Текст + 5 вопросов</span><span>A0–B1</span></div><button type="button" class="card-action" id="adultsStart"><span>Начать взрослый тест</span><span class="round-arrow">↗</span></button></article></section><p class="footnote">Задания составлены специально для этого теста с ориентиром на тематику Kid’s Box и уровни CEFR. Тест не является официальным экзаменом Cambridge English и не проверяет устную речь или аудирование.</p>`;
 $('#kidsStart').addEventListener('click',()=>start('kids'));$('#adultsStart').addEventListener('click',()=>start('adults'));
}
function quizHeader(t,n,wide=false){let answered=state.answers.filter(x=>x!==null).length;return `<div class="quiz-head"><div><button type="button" class="subtle-back" id="exitQuiz">← Все тесты</button><h1>${escapeHTML(t.title)}</h1><div class="quiz-sub">${escapeHTML(t.detail)} · Результаты и объяснения — в конце</div></div><span class="count-chip">${wide?'16–20':n} / ${t.questions.length}</span></div><div class="trackline" role="progressbar" aria-label="Прогресс теста" aria-valuemin="0" aria-valuemax="${t.questions.length}" aria-valuenow="${answered}"><div class="trackfill" style="width:${answered/t.questions.length*100}%"></div></div>`;}
function optionMarkup(item,globalIndex){const chosen=state.answers[globalIndex];return `<div class="options" role="group" aria-label="Варианты ответа на вопрос ${globalIndex+1}">${item.choices.map((choice,i)=>`<button class="option ${chosen===i?'selected':''}" data-question="${globalIndex}" data-option="${i}" type="button" aria-pressed="${chosen===i}"><span class="option-letter">${'ABCD'[i]}</span><span>${escapeHTML(choice)}</span>${chosen===i?'<span class="checkmark" aria-hidden="true">✓</span>':''}</button>`).join('')}</div>`;}
function bindCommon(){const exit=$('#exitQuiz');if(exit)exit.addEventListener('click',()=>{if(confirm('Выйти из теста? Ответы будут сброшены.'))goHome();});main.querySelectorAll('[data-option]').forEach(el=>el.addEventListener('click',()=>choose(Number(el.dataset.question),Number(el.dataset.option))));}
function choose(index,option){if(state.view!=='quiz')return;if(getReading()){if(index<15||index>19)return;}else if(index!==state.index)return;cancelTimer();state.answers[index]=option;playSound('pick');
 const block=main.querySelector(`[data-question="${index}"]`)?.closest('.options');if(block){block.querySelectorAll('.option').forEach(el=>{const active=Number(el.dataset.option)===option;el.classList.toggle('selected',active);el.setAttribute('aria-pressed',String(active));let mark=el.querySelector('.checkmark');if(active&&!mark)el.insertAdjacentHTML('beforeend','<span class="checkmark" aria-hidden="true">✓</span>');if(!active&&mark)mark.remove();});}
 const bar=$('.trackfill');if(bar)bar.style.width=`${state.answers.filter(x=>x!==null).length/25*100}%`;const progress=$('.trackline');if(progress)progress.setAttribute('aria-valuenow',String(state.answers.filter(x=>x!==null).length));
 const nextButton=$('#nextQuestion');if(nextButton)nextButton.disabled=false;
 if(getReading()){const remaining=[15,16,17,18,19].filter(i=>state.answers[i]===null);let done=$('#readingDone');if(done)done.textContent=`${5-remaining.length} из 5 ответов`;const go=$('#readingNext');if(go)go.disabled=remaining.length>0; timer=setTimeout(()=>{timer=null;if(remaining.length){const nextItem=document.getElementById('readingItem'+remaining[0]);if(nextItem)nextItem.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});}else{playSound('next');state.index=20;render();jumpTop();}},1050);}
 else{const hint=$('#autoHint');if(hint)hint.textContent='Ответ сохранён. Следующий вопрос…';timer=setTimeout(()=>{timer=null;advance();},950);}
}
function advance(){cancelTimer();if(state.view!=='quiz')return;if(getReading()){if([15,16,17,18,19].some(i=>state.answers[i]===null))return;state.index=20;}else if(state.answers[state.index]===null)return;else if(state.index===24){state.view='result';}else{state.index++;}playSound('next');render();jumpTop();}
function prev(){cancelTimer();if(state.view!=='quiz')return;if(getReading())state.index=14;else if(state.index===20)state.index=15;else if(state.index>0)state.index--;else {goHome();return;}render();jumpTop();}
function renderQuiz(){const t=TRACKS[state.track];if(getReading()){renderReading(t);return;}const n=state.index+1,item=t.questions[state.index],lv=t.levels[item.levelIndex],chosen=state.answers[state.index];
 main.innerHTML=`<div class="quiz-shell">${quizHeader(t,n)}<section class="question-card"><div class="question-overline"><span class="question-stage">${escapeHTML(lv.name)}</span><span class="question-num">Вопрос ${n} из 25</span></div><h2 class="question-text">${escapeHTML(item.prompt)}</h2>${item.image?`<div class="picture-frame"><img alt="Иллюстрация к вопросу" draggable="false" src="${IMAGE_DATA[item.image]}"></div>`:''}<div class="question-instruction">Выбери один правильный ответ</div>${optionMarkup(item,state.index)}</section><div id="autoHint" class="auto-hint" role="status">После выбора ответа переход произойдёт автоматически</div><div class="quiz-controls"><button class="secondary" id="prevQuestion" type="button">← Назад</button><button class="primary" type="button" id="nextQuestion" ${chosen===null?'disabled':''}>${n===25?'Показать результат':'Далее →'}</button></div><div class="kbd-hint">Быстрый ответ: клавиши 1–${item.choices.length} · Можно вернуться к предыдущему вопросу</div></div>`;
 bindCommon();$('#prevQuestion').addEventListener('click',prev);$('#nextQuestion').addEventListener('click',advance);
}
function renderReading(t){const items=t.questions.slice(15,20);let done=items.filter((_,i)=>state.answers[15+i]!==null).length;
 main.innerHTML=`<div class="reading-shell">${quizHeader(t,'16–20',true)}<div class="reading-wrap"><article class="passage"><div class="group-label">Часть 2 · Reading</div><h2>Прочитай текст</h2><p lang="en">${escapeHTML(PASSAGE)}</p><div class="soft-section">Текст остаётся здесь, пока ты отвечаешь на все пять вопросов.</div></article><section class="reading-questions"><div class="question-stage">Вопросы 16–20</div><h2>Проверь понимание текста</h2>${items.map((item,i)=>{const gi=15+i;return `<div class="reading-item" id="readingItem${gi}"><div class="question-num">Вопрос ${gi+1} из 25</div><h3 class="question-text">${escapeHTML(item.prompt)}</h3>${optionMarkup(item,gi)}</div>`;}).join('')}<div class="reading-finish"><div class="group-label" id="readingDone">${done} из 5 ответов</div><button class="primary" id="readingNext" type="button" ${done!==5?'disabled':''}>Продолжить →</button></div></section></div><div class="quiz-controls"><button class="secondary" id="prevQuestion">← К вопросу 15</button><span class="quiz-small-note">После пятого ответа перейдём дальше</span></div></div>`;
 bindCommon();$('#prevQuestion').addEventListener('click',prev);$('#readingNext').addEventListener('click',advance);
}
function evaluate(){const t=TRACKS[state.track];const bucket=t.levels.map((lv,i)=>({name:lv.name,short:lv.short,correct:0,total:lv.questions.length,index:i,needed:Math.ceil(lv.questions.length*.7)}));let correct=0;t.questions.forEach((item,i)=>{if(state.answers[i]===item.answer){correct++;bucket[item.levelIndex].correct++;}});let recommended=bucket.findIndex(b=>b.correct<b.needed);const allMastered=recommended===-1;if(allMastered)recommended=bucket.length-1;return{bucket,correct,total:t.questions.length,percent:Math.round(correct/t.questions.length*100),recommended,allMastered};}
function reviewLabel(item){if(item.image)return 'Лексика · Картинка';if(item.kind==='reading')return 'Чтение';if(item.kind==='situation')return 'Речевая ситуация';if(item.kind==='check')return 'Грамматический выбор';return 'Грамматика и лексика';}
function renderResults(){const t=TRACKS[state.track],r=evaluate(),rec=t.levels[r.recommended];let desc;
 if(state.track==='kids')desc=r.allMastered?'Материал до Kid’s Box 3 включительно выполнен уверенно. Следующий уровень можно обсудить с преподавателем.':`По результатам теста стоит начать или повторить материал ступени ${rec.name}.`;
 else desc=r.allMastered?'Задания до Intermediate (B1) выполнены уверенно. Для точного подбора группы стоит дополнить тест беседой и аудированием.':`Ориентир для занятий — ${rec.name} (${rec.short}). На этой ступени желательно закрепить пробелы.`;
 main.innerHTML=`<div class="results"><div class="result-top"><div class="eyebrow">Assessment complete</div><h1>Результат и следующий шаг.</h1><p>Посмотри итоговый балл, сильные стороны и ответы с короткими объяснениями.</p></div><section class="result-hero"><div><div class="result-kicker">Рекомендуемая ступень</div><div class="result-name">${escapeHTML(rec.name)}</div><div class="result-desc">${escapeHTML(desc)}</div></div><div class="score-bubble"><span class="score-num">${r.correct}<span style="font-size:20px;color:#afc5e8">/${r.total}</span></span><span class="score-label">верно · ${r.percent}%</span></div></section><section class="white-panel"><h2 class="section-title">Как ты справился с заданиями</h2><p class="section-sub">На каждой ступени показаны правильные ответы. Для ориентира освоения используется порог 70% (с округлением вверх).</p>${r.bucket.map(b=>`<div class="level-row"><div class="level-name">${escapeHTML(b.name)}<div class="level-tag">${escapeHTML(b.short)}</div></div><div class="level-track"><div class="level-value" style="width:${b.correct/b.total*100}%"></div></div><div class="level-score">${b.correct}/${b.total}</div></div>`).join('')}<div class="tag-recommend">${r.allMastered?'Все ступени теста пройдены уверенно':'Рекомендация: '+escapeHTML(rec.name)}</div></section><section class="white-panel"><h2 class="section-title">Разбор всех 25 вопросов</h2><p class="section-sub">Твой ответ, правильный вариант и объяснение к каждому заданию.</p><button class="toggle-review" id="toggleReview" type="button" aria-expanded="false"><span>Показать разбор</span><span id="toggleIcon">＋</span></button><div id="review" class="review-section hidden">${t.questions.map((item,i)=>{const good=state.answers[i]===item.answer;const a=state.answers[i];return `<article class="review-item"><div class="review-top"><span class="review-status ${good?'':'no'}">${good?'✓':'×'}</span><div class="review-body"><div class="review-type">${escapeHTML(reviewLabel(item))} · ${escapeHTML(t.levels[item.levelIndex].name)}</div><div class="review-q">${i+1}. ${escapeHTML(item.prompt)}</div><p class="review-detail"><b>Твой ответ:</b> ${a===null?'Не выбран':escapeHTML(item.choices[a])}<br><b>Правильный:</b> ${escapeHTML(item.choices[item.answer])}</p><div class="review-why">${escapeHTML(item.why)}</div></div></div></article>`;}).join('')}</div></section><div class="result-actions"><button class="primary" id="restart">Пройти ещё раз</button><button class="secondary" id="goAll">Другой тест</button><button class="secondary" id="printResults">Распечатать</button><button class="secondary" id="copyResult">Скопировать итог</button></div><p class="result-info">Результат предварительный: 25 вопросов не заменяют полноценную проверку чтения, письма, аудирования и речи. Задания оригинальные, не являются официальными экзаменационными материалами Cambridge.</p></div>`;
 $('#toggleReview').addEventListener('click',()=>{const review=$('#review');const hidden=review.classList.toggle('hidden');$('#toggleReview').setAttribute('aria-expanded',String(!hidden));$('#toggleReview span').textContent=hidden?'Показать разбор':'Скрыть разбор';$('#toggleIcon').textContent=hidden?'＋':'−';});
 $('#restart').addEventListener('click',()=>start(state.track));$('#goAll').addEventListener('click',goHome);$('#printResults').addEventListener('click',()=>{const review=$('#review');review.classList.remove('hidden');window.print();});$('#copyResult').addEventListener('click',async()=>{const summary=`Northstar English\n${t.title}\nРезультат: ${r.correct}/${r.total} (${r.percent}%)\nРекомендуемая ступень: ${rec.name}\n${r.bucket.map(b=>b.name+': '+b.correct+'/'+b.total).join('\n')}`;try{await navigator.clipboard.writeText(summary);$('#copyResult').textContent='Скопировано ✓';}catch(e){$('#copyResult').textContent='Не удалось скопировать';}});
}
function render(){main.innerHTML='';$('#headerBack').classList.toggle('hidden',state.view==='home');if(state.view==='home')renderHome();else if(state.view==='quiz')renderQuiz();else if(state.view==='result')renderResults();}
$('#soundToggle').addEventListener('click',()=>{soundOn=!soundOn;updateSound();if(soundOn)playSound('pick');});
$('#logo').addEventListener('click',e=>{e.preventDefault();if(state.view==='quiz'){if(confirm('Вернуться на главную? Ответы сбросятся.'))goHome();}else goHome();});
$('#headerBack').addEventListener('click',()=>{if(state.view==='quiz'){if(confirm('Вернуться на главную? Ответы сбросятся.'))goHome();}else goHome();});
document.addEventListener('keydown',e=>{if(state.view!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||getReading()||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;const item=TRACKS[state.track].questions[state.index];if(['1','2','3','4'].includes(e.key)&&Number(e.key)<=item.choices.length){e.preventDefault();choose(state.index,Number(e.key)-1);}else if(e.key==='Enter'&&state.answers[state.index]!==null&&!['BUTTON','A'].includes(document.activeElement?.tagName)){e.preventDefault();advance();}});
updateSound();render();
})();
</script></body></html>
